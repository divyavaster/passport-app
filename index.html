<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Passport Application</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <h1>Passport Application Portal</h1>

    <p>New Passport Application</p>

</header>

<nav class="navbar">

    <a href="home.html">Home</a>

    <a href="index.html">New Application</a>

    <a href="status.html">Check Status</a>

    <a href="#" onclick="logout()">Logout</a>

</nav>

<main class="container">

<form id="passportForm">

    <h2>Applicant Details</h2>

    <label>Full Name</label>

    <input
        type="text"
        id="passportName"
        required
    >

    <label>Date of Birth</label>

    <input
        type="date"
        id="dob"
        required
    >

    <label>Gender</label>

    <select id="gender" required>

        <option value="">
            Select Gender
        </option>

        <option>Male</option>

        <option>Female</option>

        <option>Other</option>

    </select>

    <label>Mobile Number</label>

    <input
        type="tel"
        id="passportMobile"
        maxlength="10"
        pattern="[0-9]{10}"
        required
    >

    <label>Email</label>

    <input
        type="email"
        id="passportEmail"
        required
    >

    <h2>Address</h2>

    <label>Address</label>

    <textarea
        id="address"
        rows="4"
        required
    ></textarea>

    <label>City</label>

    <input
        type="text"
        id="city"
        required
    >

    <label>State</label>

    <input
        type="text"
        id="state"
        required
    >

    <label>PIN Code</label>

    <input
        type="text"
        id="pincode"
        maxlength="6"
        pattern="[0-9]{6}"
        required
    >

    <h2>Documents</h2>

    <label>Upload Document</label>

    <input
        type="file"
        id="document"
        required
    >

    <button type="submit">
        Submit Application
    </button>

    <button
        type="button"
        class="secondary-button"
        onclick="location.href='status.html'"
    >
        Check Status
    </button>

</form>

<div id="result" class="result"></div>

</main>

<script src="script.js"></script>

</body>
</html>
