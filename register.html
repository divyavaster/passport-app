<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <h1>Passport Application Portal</h1>

    <p>Create Account</p>

</header>

<div class="container">

    <form id="registerForm">

        <h2>Create Account</h2>

        <label>Full Name</label>

        <input
            type="text"
            id="name"
            required
        >

        <label>Email</label>

        <input
            type="email"
            id="email"
            required
        >

        <label>Mobile Number</label>

        <input
            type="tel"
            id="mobile"
            maxlength="10"
            pattern="[0-9]{10}"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            minlength="6"
            required
        >

        <label>Confirm Password</label>

        <input
            type="password"
            id="confirmPassword"
            minlength="6"
            required
        >

        <button type="submit">
            Create Account
        </button>

        <p id="message" class="message"></p>

        <p class="center">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </form>

</div>

<script src="script.js"></script>

</body>
</html>
