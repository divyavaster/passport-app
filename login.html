<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Passport Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Passport Application Portal</h1>
    <p>Login</p>
</header>

<div class="container">

    <form id="loginForm">

        <h2>Login</h2>

        <label>Email</label>

        <input
            type="email"
            id="loginEmail"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="loginPassword"
            required
        >

        <button type="submit">
            Login
        </button>

        <p id="loginMessage" class="message"></p>

        <p class="center">
            New user?
            <a href="register.html">
                Create Account
            </a>
        </p>

    </form>

</div>

<script src="script.js"></script>

</body>
</html>
